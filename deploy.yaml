apiVersion: apps/v1
kind: Deployment
metadata:
  name: position-tracker
  namespace: jenkins

spec:
  selector:
    matchLabels:
      app: position-tracker
  replicas: 1
  template: # template for the pods
    metadata:
      labels:
        app: position-tracker
    spec:
      containers:
      - name: position-tracker
        image: ${REPOSITORY_TAG}
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production-microservice
        - name: SPRING_DATA_MONGODB_URI
          value: mongodb://fleetman-mongodb.jenkins.svc.cluster.local:27017/fleetman
        - name: QUEUE_HOST
          value: fleetman-queue.jenkins.svc.cluster.local 
        imagePullPolicy: Never
        readinessProbe:
          httpGet:
            path: /vehicles/
            port: 8080
          initialDelaySeconds: 20   # espera 20s antes de la primera prueba
          periodSeconds: 10         # prueba cada 10s
          timeoutSeconds: 5         # da hasta 5s de espera a la respuesta
          failureThreshold: 6       # permite hasta 6 fallos antes de marcar Unhealthy
---
apiVersion: v1
kind: Service
metadata:
  name: position-tracker
  namespace: jenkins


spec:
  # This defines which pods are going to be represented by this Service
  # The service becomes a network endpoint for either other services
  # or maybe external users to connect to (eg browser)
  selector:
    app: position-tracker

  ports:
    - name: http
      port: 8080

  type: ClusterIP

